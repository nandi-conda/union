context:
  version: 6.31.0
package:
  name: kf6-ecm
  version: ${{ version }}
source:
  git: https://github.com/KDE/extra-cmake-modules.git
  tag: v6.31.0
build:
  number: 0
  script:
  - cmake -GNinja -S . -B build $CMAKE_ARGS -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_QCH=OFF -DBUILD_PYTHON_BINDINGS=OFF
    -DBUILD_DESIGNERPLUGIN=OFF
  - cmake --build build
  - cmake --install build
  noarch: generic
requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - ${{ stdlib('c') }}
  - cmake
  - ninja
  - pkg-config
  host: []
about:
  homepage: https://invent.kde.org/frameworks/extra-cmake-modules
  license: BSD-3-Clause
  summary: 'KDE Frameworks 6: extra-cmake-modules'
