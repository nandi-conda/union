context:
  version: 6.31.0
package:
  name: kf6-kguiaddons
  version: ${{ version }}
source:
  git: https://github.com/KDE/kguiaddons.git
  tag: v6.31.0
build:
  number: 1
  script:
  - cmake -GNinja -S . -B build $CMAKE_ARGS -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_QCH=OFF -DBUILD_PYTHON_BINDINGS=OFF
    -DBUILD_DESIGNERPLUGIN=OFF -DWITH_WAYLAND=OFF
  - cmake --build build
  - cmake --install build
requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - ${{ stdlib('c') }}
  - cmake
  - ninja
  - pkg-config
  - python
  - gettext
  host:
  - kf6-ecm
  - qt6-main 6.11.2.*
  - libgl-devel
  - libopengl-devel
  - xorg-libx11
  - libxcb
  run:
  - qt6-main >=6.11.2,<6.12
  run_exports:
  - ${{ pin_subpackage('kf6-kguiaddons', upper_bound='x.x') }}
about:
  homepage: https://invent.kde.org/frameworks/kguiaddons
  license: LGPL-2.0-or-later
  summary: 'KDE Frameworks 6: kguiaddons'
