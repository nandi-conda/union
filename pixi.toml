[workspace]
name = "union"
version = "0.1.0"
channels = ["conda-forge", "https://repo.prefix.dev/nandi-testing"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.15.1,<3.16"
pyyaml = "*"
rattler-build = "*"
# The PySide6 demo (examples/pyside6-demo). kde-union (from nandi-testing) is
# built against conda-forge's Qt 6.11, the same Qt as this PySide6, so the app
# runs entirely in the pixi env.
pyside6 = "6.11.2.*"
ty = ">=0.0.91,<0.0.92"
# Stubs so ty can check scripts/gen_recipes.py, which imports yaml.
types-pyyaml = "*"
kde-union = ">=6.8.1,<7"
# Kirigami (from nandi-testing, same Qt 6.11). kde-union ships its Kirigami
# platform plugin, so Kirigami picks up Union's theme and units.
kf6-kirigami = ">=6.31.0,<7"
# conda-forge's Qt loads GL through the env's libglvnd, which can't use the
# distro's Mesa, so the env needs its own. conda-forge's Mesa has no Wayland
# EGL, so the demo task uses X11 (XWayland) with Mesa's software GL (llvmpipe).
mesalib = "*"
ruff = ">=0.17.2,<0.18"

[tasks]
gen = "python scripts/gen_recipes.py"
build-chain = "bash ci/pre-package.sh"
build = { cmd = "rattler-build build --recipe recipe.yaml -c conda-forge -c ./output --output-dir output", depends-on = ["build-chain"] }
# The session sets QT_QPA_PLATFORMTHEME=kde, a plugin this env lacks. Without a
# KDE-looking theme KColorSchemeManager applies the stock BreezeDark scheme and
# drops the accent in kdeglobals; the portal theme (with XDG_CURRENT_DESKTOP=KDE)
# counts as KDE, so Union reads the accent from kdeglobals.
demo = { cmd = "python main.py", cwd = "examples/pyside6-demo", env = { QT_QPA_PLATFORM = "xcb", QT_QPA_PLATFORMTHEME = "xdgdesktopportal" } }
check = "ty check"
# Every diagnostic Zed shows (ty for Python, qmllint for QML) as one JSON list.
diagnostics = "python examples/pyside6-demo/diagnostics.py"
